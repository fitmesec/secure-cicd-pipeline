name: Security CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-ci:
    name: Tests, security scans and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install application and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run application tests
        run: python -m pytest -v

      - name: Run Bandit SAST scan
        run: |
          python -m bandit -r app -f json -o reports/bandit-report.json

      - name: Install Gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Run Gitleaks secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "${HOME}/go/bin/gitleaks" detect \
            --source . \
            --report-format json \
            --report-path reports/gitleaks-report.json \
            --exit-code 1

      - name: Run pip-audit dependency scan
        run: |
          python -m pip_audit \
            -r requirements.txt \
            -f json \
            -o reports/pip-audit-report.json

      - name: Build Docker image
        run: docker build --tag secure-cicd-pipeline:${{ github.sha }} .

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
